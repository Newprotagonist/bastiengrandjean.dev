# nginx does NOT inherit add_header from a server block into a location that
# sets its own add_header — it replaces the whole set, not merges. Rather than
# repeat (and risk drifting) these four lines in every location, each one
# includes this file instead.
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
# No JS on this site at all: no script-src needed beyond 'none'.
add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'self'; font-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
