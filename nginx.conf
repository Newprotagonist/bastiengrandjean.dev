gzip on;
gzip_types text/html text/css application/xml image/svg+xml;
gzip_min_length 512;

# www -> apex, 301 permanent
server {
    listen 80;
    server_name www.bastiengrandjean.dev;

    location = /up {
        return 200;
    }

    location / {
        return 301 https://bastiengrandjean.dev$request_uri;
    }
}

server {
    listen 80 default_server;
    server_name bastiengrandjean.dev;
    root /usr/share/nginx/html;

    # kamal-proxy healthcheck — must stay plain HTTP, it's probed from the
    # private Docker network before SSL is relevant.
    location = /up {
        return 200;
    }

    # Fingerprinted/static assets: safe to cache forever.
    location /assets/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # HTML and everything else: short cache, so edits show up quickly.
    location / {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=600" always;
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=600" always;
    }
}
